<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Web前端技术推荐墙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            color: #1a202c;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tech-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tech-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .tech-card .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .tech-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        .tech-card .desc {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }
        .tech-card .level {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #fff;
            background: #667eea;
            margin-bottom: 10px;
        }
        .tech-card .users {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>🚀 Web前端技术推荐墙</h1>
    <!-- 搜索输入框 -->
    <input id="searchInput" placeholder="搜索技术" style="display:block;margin:10px auto 30px auto;padding:8px 12px;width:300px;font-size:16px;">

    <div class="tech-grid" id="techGrid"></div>

    <script>
        // TODO1：补全10条技术数据
        const technologies = [
            { icon: "🌐", name: "HTML5", desc: "网页的骨架", level: "入门", users: 100000 },
            { icon: "🎨", name: "CSS3", desc: "网页的外衣", level: "入门", users: 95000 },
            { icon: "⚡", name: "JavaScript", desc: "网页的灵魂", level: "进阶", users: 98000 },
            { icon: "💚", name: "Vue.js", desc: "渐进式框架", level: "进阶", users: 78000 },
            { icon: "⚛️", name: "React", desc: "组件化UI库", level: "进阶", users: 82000 },
            { icon: "🔷", name: "Node.js", desc: "JS后端运行时", level: "高级", users: 65000 },
            { icon: "📦", name: "TypeScript", desc: "带类型的JS", level: "高级", users: 55000 },
            { icon: "⚡", name: "Webpack", desc: "模块打包工具", level: "高级", users: 48000 },
            { icon: "▲", name: "Vite", desc: "极速构建工具", level: "进阶", users: 42000 },
            { icon: "🔷", name: "Next.js", desc: "React全栈框架", level: "高级", users: 38000 }
        ];

        // TODO2 TODO3 TODO4：渲染函数 map + 模板字符串 + join + innerHTML
        function renderList(list) {
            const htmlArr = list.map(function (t) {
                return `
                <div class="tech-card">
                    <div class="icon">${t.icon}</div>
                    <h3>${t.name}</h3>
                    <div class="desc">${t.desc}</div>
                    <div class="level">${t.level}</div>
                    <div class="users">学习人数：${t.users}</div>
                </div>
                `;
            })
            const htmlStr = htmlArr.join('');
            const gridDom = document.getElementById('techGrid');
            gridDom.innerHTML = htmlStr;
        }

        // 页面初始化渲染全部数据
        renderList(technologies);

        // 搜索过滤功能 filter + includes
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function () {
            const keyword = this.value.trim();
            const filterArr = technologies.filter(function (item) {
                return item.name.includes(keyword);
            })
            renderList(filterArr);
        })

        // 选做：事件委托，卡片点击弹窗
        const gridDom = document.getElementById('techGrid');
        gridDom.addEventListener('click', function (e) {
            const card = e.target.closest('.tech-card');
            if (card) {
                const nameText = card.querySelector('h3').textContent;
                alert(`你点击了：${nameText}`);
            }
        })
    </script>
</body>
</html>
